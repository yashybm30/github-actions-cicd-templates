apiVersion: apps/v1
kind: Deployment
metadata: {name: verified-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: verified-api}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app: verified-api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/yashybm30/verified-api:replace-with-commit-sha
          ports: [{containerPort: 3000}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe: {httpGet: {path: /health/ready, port: 3000}}
          livenessProbe: {httpGet: {path: /health/live, port: 3000}}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Service
metadata: {name: verified-api}
spec:
  selector: {app: verified-api}
  ports: [{port: 80, targetPort: 3000}]
